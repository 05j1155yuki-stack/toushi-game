<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Helvetica Neue",Arial,"Hiragino Sans",Meiryo,sans-serif;
}

body{
    background:#050b14;
    color:#00e5ff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
    background:#0b132b;
    border:1px solid #00e5ff;
    border-radius:20px;
    padding:30px;
    box-shadow:0 0 25px rgba(0,229,255,0.25);
}

.top-nav{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.nav-link,
.nav-link-youtube,
.nav-link-fp{
    text-decoration:none;
    font-size:0.85rem;
    padding:6px 14px;
    border-radius:20px;
    transition:0.3s;
}

.nav-link{
    color:#00e5ff;
    border:1px solid #00e5ff;
}

.nav-link:hover{
    background:#00e5ff;
    color:#000;
}

.nav-link-youtube{
    color:#ff4444;
    border:1px solid #ff4444;
}

.nav-link-youtube:hover{
    background:#ff4444;
    color:#fff;
}

.nav-link-fp{
    color:#00ff88;
    border:1px solid #00ff88;
}

.nav-link-fp:hover{
    background:#00ff88;
    color:#000;
}

h1{
    text-align:center;
    margin-bottom:8px;
    color:#fff;
    text-shadow:0 0 10px #00e5ff;
}

.subtitle{
    text-align:center;
    margin-bottom:25px;
    color:#8c9eff;
    line-height:1.6;
}

.status{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:20px;
    background:#1c2541;
    padding:15px;
    border-radius:12px;
    flex-wrap:wrap;
}

.status div{
    font-weight:bold;
}

.market-box{
    background:#111827;
    border:1px solid #374151;
    border-radius:12px;
    padding:15px;
    margin-bottom:20px;
}

.market-title{
    color:#fff;
    margin-bottom:10px;
    font-weight:bold;
}

.market-news{
    color:#8c9eff;
    line-height:1.7;
}

.company-badge{
    display:inline-block;
    background:#3a506b;
    color:#fff;
    padding:4px 10px;
    border-radius:6px;
    margin-bottom:10px;
    font-size:0.85rem;
    font-weight:bold;
}

.question{
    font-size:1.2rem;
    line-height:1.7;
    margin-bottom:25px;
    color:#fff;
    font-weight:bold;
}

.answers{
    display:grid;
    gap:12px;
}

button{
    border:none;
    padding:14px;
    border-radius:10px;
    background:#1c2541;
    color:#00e5ff;
    border:1px solid #00e5ff;
    font-size:1rem;
    cursor:pointer;
    transition:0.2s;
    text-align:left;
}

button:hover{
    background:#00e5ff;
    color:#000;
}

button:disabled{
    opacity:0.7;
    cursor:not-allowed;
}

.bet-buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.result{
    margin-top:20px;
    text-align:center;
    min-height:60px;
    font-size:1.1rem;
    font-weight:bold;
    line-height:1.8;
}

.hidden{
    display:none;
}

.center{
    text-align:center;
}

.win{
    color:#00ff88;
}

.gameover{
    color:#ff4444;
}

.rank{
    margin-top:20px;
    font-size:1.5rem;
    font-weight:bold;
    color:#fff;
}

.candle{
    width:60px;
    height:120px;
    margin:20px auto;
    position:relative;
}

.candle::before{
    content:"";
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:4px;
    height:120px;
    background:#ccc;
}

.bull{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:35px;
    height:70px;
    background:#00ff88;
    bottom:10px;
    animation:pump 0.5s infinite alternate;
}

.bear{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:35px;
    height:70px;
    background:#ff4444;
    top:10px;
    animation:dump 0.5s infinite alternate;
}

@keyframes pump{
    from{transform:translateX(-50%) scaleY(1);}
    to{transform:translateX(-50%) scaleY(1.1);}
}

@keyframes dump{
    from{transform:translateX(-50%) scaleY(1);}
    to{transform:translateX(-50%) scaleY(0.9);}
}

.risk-box{
    margin-bottom:20px;
}

.risk-title{
    color:#fff;
    margin-bottom:10px;
    font-weight:bold;
}

.risk-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.risk-low{
    border-color:#00ff88;
    color:#00ff88;
}

.risk-mid{
    border-color:#ffd166;
    color:#ffd166;
}

.risk-high{
    border-color:#ff4444;
    color:#ff4444;
}

.cta-box{
    margin-top:30px;
    background:#1c2541;
    padding:20px;
    border-radius:15px;
    border:1px dashed #8c9eff;
}

.cta-title{
    font-size:1.1rem;
    color:#fff;
    margin-bottom:15px;
    font-weight:bold;
}

.cta-buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.cta-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    padding:15px;
    border-radius:10px;
    font-weight:bold;
    font-size:0.95rem;
    transition:0.2s;
}

.cta-blog{
    background:transparent;
    color:#00e5ff;
    border:1px solid #00e5ff;
}

.cta-blog:hover{
    background:#00e5ff;
    color:#000;
}

.cta-yt{
    background:transparent;
    color:#ff4444;
    border:1px solid #ff4444;
}

.cta-yt:hover{
    background:#ff4444;
    color:#fff;
}

.share-box{
    margin-top:20px;
}

.share-text{
    background:#111827;
    border:1px solid #374151;
    border-radius:10px;
    padding:15px;
    color:#fff;
    line-height:1.7;
    margin-top:10px;
    white-space:pre-line;
}

@media(max-width:700px){

    .bet-buttons,
    .cta-buttons,
    .risk-buttons{
        grid-template-columns:1fr;
    }

    .status{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>📊 個別株・決算マタギ編 ULTIMATE</h1>

<div class="subtitle">
AI・半導体・電力インフラ決算を読み解き、<br>
伝説 of 相場師を目指せ。
</div>

<div class="status">
<div>💰 資金：<span id="points">10000</span> pt</div>
<div>📈 取引：<span id="qnum">1</span> / 10</div>
<div>🔥 勝率：<span id="winrate">0</span>%</div>
</div>

<div class="market-box">
<div class="market-title">📰 本日の市場テーマ</div>
<div class="market-news" id="marketNews"></div>

<div class="risk-box">

<button class="risk-low" onclick="setRisk('low',1.2)">
🟢 低リスク<br>

</button>

🔴 高リスク<br>
5倍
</button>
</div>
</div>

この決算マタギに、いくら張りますか？
</div>

<div class="bet-buttons">

<button onclick="setBet(1000)">
1,000pt (打診買い)
</button>

<button onclick="setBet(3000)">
3,000pt (主力投資)
</button>

<button onclick="setBet(5000)">
5,000pt (集中投資)

style="border-color:#ff4444;color:#ff4444;">
💥 ALL-IN
</button>

</a>

</div>
</div>

<button
style="margin-top:25px;width:100%;"

🔄 次の決算期へ
</button>

</div>

<script>

const marketThemes = [
"生成AI向けデータセンター投資が加速。",
"NVIDIA決算を前に半導体株が全面高。",
"電力不足懸念で送電関連株が急騰。",
"HBM需要拡大でメモリ株が物色。",
"円安進行で輸出関連株に追い風。",
"AI CAPEX拡大で設備投資期待。"
];

document.getElementById("marketNews").textContent =
marketThemes[Math.floor(Math.random() * marketThemes.length)];

const successMessages = [
"🚀 市場予想を大幅超過！",
"🔥 AI特需継続！",
"📈 PTS急騰！",
"💹 アナリスト目標株価引き上げ！"
];

const failMessages = [
"📉 ガイダンス失望売り！",
"💥 織り込み済み暴落！",
"⚠️ 利確売り優勢！",
"🚨 AI関連全面安！"
];

const allQuestions = [

{
encode:"5803 フジクラ",
q:"フジクラが生成AIデータセンター関連で特に強みを持つ製品は？",
a:["超多芯光ファイバー","液晶パネル","スマホCPU","電気自動車"],
c:"超多芯光ファイバー"
},

{
encode:"6146 ディスコ",
q:"ディスコの主力消耗品として利益率が高い製品は？",
a:["ダイシングブレード","液晶フィルム","半導体メモリ","銅線"],
c:"ダイシングブレード"
},

{
encode:"8035 東京エレクトロン",
q:"東京エレクトロンが世界トップ級シェアを持つ装置は？",
a:["コーター・デベロッパー","エアコン","発電機","EVモーター"],
c:"コーター・デベロッパー"
},

{
encode:"6857 アドバンテスト",
q:"ATEとは何の略？",
a:["自動テスト装置","自動運転エンジン","AI転送装置","高速通信規格"],
c:"自動テスト装置"
},

{
encode:"5805 SWCC",
q:"SWCCのAIデータセンター関連特需の対象製品は？",
a:["高効率電力ケーブル","ゲーム機","飲料水","衣料品"],
c:"高効率電力ケーブル"
},

{
encode:"285A キオクシアHD",
q:"生成AIサーバーで重要な不揮発性メモリは？",
a:["NANDフラッシュメモリ","DRAM","SRAM","CPU"],
c:"NANDフラッシュメモリ"
}

];

let quizData = [];
let currentQuestion = 0;
let points = 10000;
let currentBet = 0;
let riskMultiplier = 1;
let wins = 0;

const TOTAL_PLAY = 10;

function shuffleArray(array){

const copied = [...array];

for(let i = copied.length - 1; i > 0; i--){

const j = Math.floor(Math.random() * (i + 1));

[copied[i], copied[j]] = [copied[j], copied[i]];
}

return copied;
}

function initGame(){

const shuffledQuestions = shuffleArray(allQuestions);

quizData = [];

while(quizData.length < TOTAL_PLAY){

quizData.push(
...shuffledQuestions.map(q => ({
encode:q.encode,
q:q.q,
answers:shuffleArray(q.a),
correctText:q.c
}))
);

}

quizData = quizData.slice(0,TOTAL_PLAY);

updateDisplay();
}

function updateDisplay(){

document.getElementById("points").textContent =
points.toLocaleString();

document.getElementById("qnum").textContent =
currentQuestion + 1;

const rate =
currentQuestion === 0
? 0
: Math.round((wins / currentQuestion) * 100);

document.getElementById("winrate").textContent = rate;
}

function setRisk(type,multi){

riskMultiplier = multi;

document.querySelectorAll(".risk-buttons button")
.forEach(btn => btn.style.background = "#1c2541");

event.target.style.background = "#233554";
}

function setBet(amount){

if(amount > points){
alert("資金が足りません！");
return;
}

currentBet = amount;

document.getElementById("betScreen")
.classList.add("hidden");

document.getElementById("quizScreen")
.classList.remove("hidden");

loadQuestion();
}

function loadQuestion(){

const q = quizData[currentQuestion];

document.getElementById("companyBadge").textContent =
q.encode;

document.getElementById("question").textContent =
q.q;

document.getElementById("result").innerHTML = "";

document.getElementById("chartArea").innerHTML = "";

const answersEl = document.getElementById("answers");

answersEl.innerHTML = "";

q.answers.forEach((ansText,index)=>{

const btn = document.createElement("button");

btn.textContent = `${index + 1}. ${ansText}`;

btn.onclick = ()=>checkAnswer(ansText === q.correctText);

answersEl.appendChild(btn);

});
}

function checkAnswer(isCorrect){

const buttons =
document.querySelectorAll("#answers button");

buttons.forEach(btn => btn.disabled = true);

const resultEl = document.getElementById("result");

const chartArea = document.getElementById("chartArea");

const randomSuccess =
successMessages[
Math.floor(Math.random() * successMessages.length)
];

const randomFail =
failMessages[
Math.floor(Math.random() * failMessages.length)
];

const marketShock = Math.random();

let profit = Math.floor(currentBet * riskMultiplier);

if(isCorrect){

wins++;

if(marketShock < 0.85){

points += profit;

resultEl.innerHTML =
`${randomSuccess}<br>
<span class="win">
+${profit.toLocaleString()}pt
</span>`;

resultEl.className = "result win";

chartArea.innerHTML =
`
<div class="candle">
<div class="bull"></div>
</div>
`;

}else{

points -= Math.floor(profit * 0.5);

resultEl.innerHTML =
`😱 好決算なのに暴落！<br>
<span class="gameover">
-${Math.floor(profit * 0.5).toLocaleString()}pt
</span>`;

resultEl.className = "result gameover";

chartArea.innerHTML =
`
<div class="candle">
<div class="bear"></div>
</div>
`;
}

}else{

points -= currentBet;

resultEl.innerHTML =
`${randomFail}<br>
<span class="gameover">
-${currentBet.toLocaleString()}pt
</span>`;

resultEl.className = "result gameover";

chartArea.innerHTML =
`
<div class="candle">
<div class="bear"></div>
</div>
`;
}

updateDisplay();

setTimeout(()=>{

currentQuestion++;

if(points <= 0){
endGame();
return;
}

if(currentQuestion >= TOTAL_PLAY){

endGame();

}else{

document.getElementById("quizScreen")
.classList.add("hidden");

document.getElementById("betScreen")
.classList.remove("hidden");
}

},2500);
}

function endGame(){

document.getElementById("quizScreen")
.classList.add("hidden");

document.getElementById("betScreen")
.classList.add("hidden");

document.getElementById("endScreen")
.classList.remove("hidden");

document.getElementById("finalPoints").textContent =
points.toLocaleString();

const title =
document.getElementById("endTitle");

const rankText =
document.getElementById("rankText");

let rank = "";

if(points <= 0){

title.textContent = "💥 ロスカット";
rank = "💀 イナゴ投資家";

}else if(points < 15000){

title.textContent = "📉 微妙";
rank = "🔰 初心者";

}else if(points < 40000){

title.textContent = "📈 好成績";
rank = "🥉 中級投資家";

}else{

title.textContent = "👑 爆益";
rank = "🥇 伝説の相場師";
}

rankText.textContent = rank;

document.getElementById("shareText").textContent =
`私は「${rank}」でした！
最終運用資産：${points.toLocaleString()}pt

#決算マタギゲーム
#半導体株
#AI関連株`;
}

initGame();

</script>
</body>
</html>
