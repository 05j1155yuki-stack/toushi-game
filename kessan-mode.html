<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個別株・決算マタギ編 | フリーターの投資日記</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Helvetica Neue",Arial,"Hiragino Sans",Meiryo,sans-serif;
}

body{
    background:#050b14;
    color:#00e5ff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:850px;
    background:#0b132b;
    border:1px solid #00e5ff;
    border-radius:20px;
    padding:30px;
    box-shadow:0 0 25px rgba(0,229,255,0.25);
}

.top-nav{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.nav-link,
.nav-link-youtube,
.nav-link-fp{
    text-decoration:none;
    font-size:0.85rem;
    padding:6px 14px;
    border-radius:20px;
    transition:0.3s;
}

.nav-link{
    color:#00e5ff;
    border:1px solid #00e5ff;
}

.nav-link:hover{
    background:#00e5ff;
    color:#000;
}

.nav-link-youtube{
    color:#ff4444;
    border:1px solid #ff4444;
}

.nav-link-youtube:hover{
    background:#ff4444;
    color:#fff;
}

.nav-link-fp{
    color:#00ff88;
    border:1px solid #00ff88;
}

.nav-link-fp:hover{
    background:#00ff88;
    color:#000;
}

h1{
    text-align:center;
    margin-bottom:8px;
    color:#fff;
    text-shadow:0 0 10px #00e5ff;
}

.subtitle{
    text-align:center;
    margin-bottom:25px;
    color:#8c9eff;
}

.status{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
    background:#1c2541;
    padding:15px;
    border-radius:12px;
}

.company-badge{
    display:inline-block;
    background:#3a506b;
    color:#fff;
    padding:4px 10px;
    border-radius:6px;
    margin-bottom:10px;
    font-size:0.85rem;
    font-weight:bold;
}

.question{
    font-size:1.2rem;
    line-height:1.6;
    margin-bottom:25px;
    color:#fff;
    font-weight:bold;
}

.answers{
    display:grid;
    gap:12px;
}

button{
    border:none;
    padding:14px;
    border-radius:10px;
    background:#1c2541;
    color:#00e5ff;
    border:1px solid #00e5ff;
    font-size:1rem;
    cursor:pointer;
    transition:0.2s;
    text-align:left;
}

button:hover{
    background:#00e5ff;
    color:#000;
}

.bet-buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.result{
    margin-top:20px;
    text-align:center;
    min-height:40px;
    font-size:1.1rem;
    font-weight:bold;
}

.hidden{
    display:none;
}

.center{
    text-align:center;
}

.win{
    color:#00ff88;
}

.gameover{
    color:#ff4444;
}

.rank{
    margin-top:20px;
    font-size:1.5rem;
    font-weight:bold;
    color:#fff;
}

/* 終了画面用の特別ナビゲーションボックス */
.cta-box {
    margin-top: 30px;
    background: #1c2541;
    padding: 20px;
    border-radius: 15px;
    border: 1px dashed #8c9eff;
}

.cta-title {
    font-size: 1.1rem;
    color: #fff;
    margin-bottom: 15px;
    font-weight: bold;
}

.cta-buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.cta-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    padding: 15px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 0.95rem;
    transition: 0.2s;
}

.cta-blog {
    background: transparent;
    color: #00e5ff;
    border: 1px solid #00e5ff;
}

.cta-blog:hover {
    background: #00e5ff;
    color: #000;
}

.cta-yt {
    background: transparent;
    color: #ff4444;
    border: 1px solid #ff4444;
}

.cta-yt:hover {
    background: #ff4444;
    color: #fff;
}

@media(max-width:600px){
    .bet-buttons, .cta-buttons{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">
<nav class="top-nav">
<a href="https://invest-challenge.com/" target="_blank" class="nav-link">🌐 投資日記ブログ</a>
<a href="https://www.youtube.com/@フリーターの投資日記?sub_confirmation=1" target="_blank" class="nav-link-youtube">📺 YouTubeチャンネル登録</a>
<a href="https://05j1155yuki-stack.github.io/toushi-game/index.html" class="nav-link-fp">🔰 FP3級モードへ</a>
</nav>

<h1>📊 個別株・決算マタギ編</h1>
<div class="subtitle">半導体・AI・インフラ決算を読んで、伝説 of 相場師を目指せ！</div>

<div class="status">
<div>資金：<span id="points">10000</span> pt</div>
<div>取引：<span id="qnum">1</span> / 10</div>
</div>

<div id="betScreen">
<div class="question center">この決算マタギに、いくら張りますか？</div>
<div class="bet-buttons">
<button onclick="setBet(1000)">1,000pt (打診買い)</button>
<button onclick="setBet(3000)">3,000pt (主力投資)</button>
<button onclick="setBet(5000)">5,000pt (集中投資)</button>
<button onclick="setBet(points)" style="border-color:#ff4444;color:#ff4444;">💥 ALL-IN</button>
</div>
</div>

<div id="quizScreen" class="hidden">
<div id="companyBadge" class="company-badge"></div>
<div id="question" class="question"></div>
<div id="answers" class="answers"></div>
<div id="result" class="result"></div>
</div>

<div id="endScreen" class="hidden center">
<h2 id="endTitle"></h2>
<div id="rankText" class="rank"></div>
<p style="margin-top:20px;font-size:1.2rem;">最終運用資産：<span id="finalPoints"></span> pt</p>

<div class="cta-box">
<div class="cta-title">📢 今回の決算の“ガチ分析”はここで読める！</div>
<div class="cta-buttons">
<a href="https://invest-challenge.com/" target="_blank" class="cta-btn cta-blog">🌐 投資日記ブログを読む</a>
<a href="https://www.youtube.com/@フリーターの投資日記?sub_confirmation=1" target="_blank" class="cta-btn cta-yt">📺 YouTubeチャンネル登録</a>
</div>
</div>

<button style="margin-top:25px;width:100%;" onclick="location.reload()">🔄 次の決算期へ</button>
</div>
</div>

<script>
/* =========================
   クイズデータ
========================= */
const allQuestions = [
    {
        encode: "5803 フジクラ",
        q: "フジクラが生成AIデータセンター関連で特に強みを持つ製品は？",
        a: ["超多芯光ファイバー", "液晶パネル", "スマホCPU", "電気自動車"],
        c: "超多芯光ファイバー"
    },
    {
        encode: "6146 ディスコ",
        q: "ディスコの主力消耗品として利益率が高い製品は？",
        a: ["ダイシングブレード", "液晶フィルム", "半導体メモリ", "銅線"],
        c: "ダイシングブレード"
    },
    {
        encode: "8035 東京エレクトロン",
        q: "東京エレクトロンが世界トップ級シェアを持つ装置は？",
        a: ["コーター・デベロッパー", "エアコン", "発電機", "EVモーター"],
        c: "コーター・デベロッパー"
    },
    {
        encode: "6857 アドバンテスト",
        q: "ATEとは何の略？",
        a: ["自動テスト装置", "自動運転エンジン", "AI転送装置", "高速通信規格"],
        c: "自動テスト装置"
    },
    {
        encode: "5802 住友電工",
        q: "住友電工のAI関連材料として重要なのは？",
        a: ["光ファイバーケーブル", "小麦", "不動産", "飲料水"],
        c: "光ファイバーケーブル"
    },
    {
        encode: "5805 SWCC",
        q: "SWCC(5805)の最新決算で利益率が急改善している背景にある、生成AI×データセンター特需の対象製品は？",
        a: ["高効率電力ケーブル・防災電線", "自動車用ワイヤー", "スマホ用銅箔", "半導体用特殊ガス"],
        c: "高効率電力ケーブル・防災電線"
    },
    {
        encode: "6622 ダイヘン",
        q: "ダイヘン(6622)が誇る『二刀流』のビジネスモデル。クリーンルーム用ロボットと、もう一つの柱である電力インフラ機器は？",
        a: ["変圧器（トランス）", "パワーコンディショナ", "リチウムイオン電池", "ガスタービン"],
        c: "変圧器（トランス）"
    },
    {
        encode: "285A キオクシアHD",
        q: "キオクシアHD(285A)の主戦場であり、生成AIサーバーやスマホのデータ保存に必須の不揮発性メモリの名称は？",
        a: ["NANDフラッシュメモリ", "DRAM", "HBM", "SRAM"],
        c: "NANDフラッシュメモリ"
    },
    {
        encode: "📊 マクロ経済",
        q: "AIデータセンターの建設が世界中で激増した際、半導体製造装置株の後を追って「ドミノ倒し」のように物色されるセクターは？",
        a: ["電力・送電インフラ関連株", "旅行・インバウンド関連株", "ディフェンシブ食品株", "地方銀行株"],
        c: "電力・送電インフラ関連株"
    },
    {
        encode: "💡 ファンダメンタルズ",
        q: "ディスコ等の超高収益企業を分析する際、売上高から製造原価を引いた「売上総利益」の割合を示す指標は？",
        a: ["粗利益率（グロスマージン）", "PER", "PBR", "自己資本比率"],
        c: "粗利益率（グロスマージン）"
    }
];

let quizData = [];
let currentQuestion = 0;
let points = 10000;
let currentBet = 0;
const TOTAL_PLAY = 10;

function shuffleArray(array) {
    const copied = [...array];
    for (let i = copied.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copied[i], copied[j]] = [copied[j], copied[i]];
    }
    return copied;
}

function initGame(){
    const shuffledQuestions = shuffleArray(allQuestions);
    quizData = shuffledQuestions.map(q => {
        return {
            encode: q.encode,
            q: q.q,
            answers: shuffleArray(q.a),
            correctText: q.c
        };
    });
    updateDisplay();
}

function updateDisplay(){
    document.getElementById("points").textContent = points.toLocaleString();
    document.getElementById("qnum").textContent = currentQuestion + 1;
}

function setBet(amount){
    if(amount > points){
        alert("資金が足りません！");
        return;
    }
    currentBet = amount;
    document.getElementById("betScreen").classList.add("hidden");
    document.getElementById("quizScreen").classList.remove("hidden");
    loadQuestion();
}

function loadQuestion(){
    const q = quizData[currentQuestion];
    document.getElementById("companyBadge").textContent = q.encode;
    document.getElementById("question").textContent = q.q;
    document.getElementById("result").textContent = "";

    const answersEl = document.getElementById("answers");
    answersEl.innerHTML = "";

    q.answers.forEach((ansText, index) => {
        const btn = document.createElement("button");
        btn.textContent = `${index + 1}. ${ansText}`;
        btn.onclick = () => checkAnswer(ansText === q.correctText);
        answersEl.appendChild(btn);
    });
}

function checkAnswer(isCorrect){
    const buttons = document.querySelectorAll("#answers button");
    buttons.forEach(btn => { btn.disabled = true; });

    const resultEl = document.getElementById("result");

    if(isCorrect){
        points += currentBet;
        resultEl.innerHTML = `🔥 決算成功！<br><span class="win">+${currentBet.toLocaleString()}pt</span>`;
        resultEl.className = "result win";
    }else{
        points -= currentBet;
        resultEl.innerHTML = `📉 決算ミス！<br><span class="gameover">-${currentBet.toLocaleString()}pt</span>`;
        resultEl.className = "result gameover";
    }

    updateDisplay();

    setTimeout(()=>{
        currentQuestion++;

        if(points <= 0){
            endGame();
            return;
        }

        if(currentQuestion >= TOTAL_PLAY){
            endGame();
        }else{
            document.getElementById("quizScreen").classList.add("hidden");
            document.getElementById("betScreen").classList.remove("hidden");
        }
    }, 2000);
}

function endGame(){
    document.getElementById("quizScreen").classList.add("hidden");
    document.getElementById("betScreen").classList.add("hidden");
    document.getElementById("endScreen").classList.remove("hidden");

    document.getElementById("finalPoints").textContent = points.toLocaleString();

    const title = document.getElementById("endTitle");
    const rankText = document.getElementById("rankText");

    if(points <= 0){
        title.textContent = "💥 ロスカット";
        rankText.textContent = "💀 イナゴ投資家";
    }else if(points < 15000){
        title.textContent = "📉 微妙";
        rankText.textContent = "🔰 初心者";
    }else if(points < 40000){
        title.textContent = "📈 好成績";
        rankText.textContent = "🥉 中級投資家";
    }else{
        title.textContent = "👑 爆益";
        rankText.textContent = "🥇 伝説の相場師";
    }
}

initGame();
</script>
</body>
</html>
