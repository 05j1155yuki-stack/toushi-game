<script>

const allQuestions = [

    // リスク管理（保険）

        a:[

            "延長（定期）保険",

        ],

    // 金融資産運用
    {

        a:[

    },

    {

        ],
        c:"医療費控除"
    },

    {

            "50万円"
        ],
        c:"20万円"
    },

    {

        a:[

            "住民税のみが控除される",
            "控除上限額は一律10万円である"
        ],
        c:"寄付金額から2,000円を差し引いた額が所得税・住民税から控除される"
    },

    // 不動産
    {

        a:[

    {

        a:[

            "表題部",
            "表示部",

    // 相続・事業承継
    {

        a:[
            "2分の1",
            "3分の2",
            "4分の3",
            "3分の1"
        ],
        c:"2分の1"
    },

    {
        q:"相続税の基礎控除額の計算式として正しいのは？",
        a:[
            "3,000万円 ＋ 600万円 × 法定相続人の数",
            "5,000万円 ＋ 1,000万円 × 法定相続人の数",
            "3,000万円 ＋ 1,000万円 × 法定相続人の数",
            "5,000万円 ＋ 600万円 × 法定相続人の数"
        ],
        c:"3,000万円 ＋ 600万円 × 法定相続人の数"
    },

    {
        q:"贈与税の配偶者控除（おしどり贈与）の適用要件として正しいのは？",
        a:[
            "婚姻期間が20年以上の配偶者への居住用不動産等の贈与",
            "婚姻期間が10年以上の配偶者への現金贈与",
            "婚姻期間が5年以上の配偶者への不動産の贈与",
            "婚姻期間不問で居住用不動産に限る"

    }

];

let quizData = [];
let currentQuestion = 0;
let points = 10000;
let currentBet = 0;

const TOTAL_PLAY = 10;

function shuffleArray(array){

    const copied = [...array];

    for(let i = copied.length - 1; i > 0; i--){

        const j = Math.floor(Math.random() * (i + 1));

        [copied[i], copied[j]] = [copied[j], copied[i]];
    }

    return copied;
}

function initGame(){

    const shuffledQuestions =
        shuffleArray(allQuestions).slice(0, TOTAL_PLAY);

    quizData = shuffledQuestions.map(q => {

        return{
            q:q.q,
            answers:shuffleArray(q.a),
            correctText:q.c
        };
    });

    updateDisplay();
}

function updateDisplay(){

    document.getElementById("points").textContent =
        points.toLocaleString();

    document.getElementById("qnum").textContent =
        currentQuestion + 1;
}

function setBet(amount){

    if(amount > points){

        alert("ポイントが足りません！");
        return;
    }

    currentBet = amount;

    document
        .getElementById("betScreen")
        .classList.add("hidden");

    document
        .getElementById("quizScreen")
        .classList.remove("hidden");

    loadQuestion();
}

function loadQuestion(){

    const resultEl =
        document.getElementById("result");

    resultEl.textContent = "";
    resultEl.className = "result";

    const q = quizData[currentQuestion];

    document.getElementById("question").textContent =
        q.q;

    const answersEl =
        document.getElementById("answers");

    answersEl.innerHTML = "";

    q.answers.forEach((ansText,idx)=>{

        const btn =
            document.createElement("button");

        btn.textContent =
            `${idx + 1}. ${ansText}`;

        btn.onclick =
            () => checkAnswer(ansText === q.correctText);

        answersEl.appendChild(btn);
    });
}

function checkAnswer(isCorrect){

    const buttons =
        document
            .getElementById("answers")
            .querySelectorAll("button");

    buttons.forEach(b => b.disabled = true);

    const resultEl =
        document.getElementById("result");

    const q =
        quizData[currentQuestion];

    if(isCorrect){

        points += currentBet;

        resultEl.innerHTML =
            `✅ 正解！ +${currentBet.toLocaleString()}pt`;

        resultEl.className = "result win";

    }else{

        points -= currentBet;

        resultEl.innerHTML =
            `❌ 不正解... -${currentBet.toLocaleString()}pt<br><small>正解：${q.correctText}</small>`;

        resultEl.className = "result gameover";

        document.body.classList.add("flash-red");

        setTimeout(()=>{

            document.body.classList.remove("flash-red");

        },800);
    }

    updateDisplay();

    setTimeout(()=>{

        if(points <= 0){

            endGame();
            return;
        }

        currentQuestion++;

        if(currentQuestion >= TOTAL_PLAY){

            endGame();

        }else{

            document
                .getElementById("quizScreen")
                .classList.add("hidden");

            document
                .getElementById("betScreen")
                .classList.remove("hidden");
        }

    },2000);
}

function endGame(){

    document
        .getElementById("quizScreen")
        .classList.add("hidden");

    document
        .getElementById("betScreen")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document.getElementById("finalPoints").textContent =
        points.toLocaleString();

    const title =
        document.getElementById("endTitle");

    const rankText =
        document.getElementById("rankText");

    if(points <= 0){

        title.textContent =
            "💥 強制ロスカット（退場）";

        title.className = "gameover";

        rankText.textContent =
            "💀 退場した投資家";

    }else if(points < 10000){

        title.textContent =
            "📉 資産減少";

        rankText.textContent =
            "🔰 FP3級 勉強中";

    }else if(points < 50000){

        title.textContent =
            "📈 堅実運用";

        rankText.textContent =
            "🥉 FP3級 合格圏内";

    }else if(points < 200000){

        title.textContent =
            "🚀 爆益達成";

        rankText.textContent =
            "🥈 FP3級 優秀合格";

    }else{

        title.textContent =
            "👑 億り人達成";

        rankText.textContent =
            "🥇 FP2級への挑戦者";

        title.className = "win";
    }
}

function shareResult(){

    const rank =
        document.getElementById("rankText").textContent;

    const text =
        `【FP3級 過去問クイズ】資産 ${points.toLocaleString()}pt 達成！ランク：${rank}\n#FP3級 #ファイナンシャルプランナー #投資\n`;

    const url =
        "https://twitter.com/intent/tweet?text=" +
        encodeURIComponent(text) +
        "&url=" +
        encodeURIComponent("https://invest-challenge.com/");

    window.open(url,"_blank");
}

initGame();

</script>
