<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FP3級 投資クイズゲーム Professional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
        }

        body {
            background: #050505;
            color: #00ff88;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: 0.3s;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: #111;
            border: 1px solid #00ff88;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.8rem;
            text-shadow: 0 0 10px #00ff88;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 25px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .status {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
            background: #0b0b0b;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .question {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .answers {
            display: grid;
            gap: 12px;
        }

        button {
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: #1a1a1a;
            color: #00ff88;
            border: 1px solid #00ff88;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
        }

        button:hover {
            background: #00ff88;
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .bet-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .result {
            margin-top: 20px;
            text-align: center;
            min-height: 40px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .hidden { display: none; }
        .center { text-align: center; }

        .blog-btn {
            width: 100%;
            margin-top: 15px;
            background: #00ff88;
            color: #000 !important;
            font-weight: bold;
            text-align: center;
        }

        .win { color: #00ff88; }
        .gameover { color: #ff4444; text-shadow: 0 0 10px #ff4444; }

        @keyframes flashRed {
            from { background: #050505; }
            to { background: #550000; }
        }
        .flash-red { animation: flashRed 0.5s alternate 4; }

        .rank { margin-top: 20px; font-size: 1.5rem; font-weight: bold; }

        @media(max-width:600px){
            .bet-buttons { grid-template-columns: 1fr; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📈 FP3級 投資クイズゲーム</h1>
    <div class="subtitle">全30問からランダムに出題される実践編</div>

    <div class="status">
        <div>保有：<span id="points">10000</span> pt</div>
        <div>進捗：<span id="qnum">1</span> / 10</div>
    </div>

    <div id="betScreen">
        <div class="question center">次の市場にいくらBETしますか？</div>
        <div class="bet-buttons">
            <button onclick="setBet(1000)">1,000pt (手堅く)</button>
            <button onclick="setBet(3000)">3,000pt (勝負)</button>
            <button onclick="setBet(5000)">5,000pt (強気)</button>
            <button onclick="setBet(points)" style="border-color:#ff4444; color:#ff4444;">💥 ALL-IN (全額)</button>
        </div>
    </div>

    <div id="quizScreen" class="hidden">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
        <div class="result" id="result"></div>
    </div>

    <div id="endScreen" class="hidden center">
        <h2 id="endTitle"></h2>
        <div class="rank" id="rankText"></div>
        <p style="margin-top:20px; font-size:1.2rem;">最終資産：<span id="finalPoints"></span> pt</p>
        <button class="blog-btn" onclick="location.reload()">🔄 再挑戦する</button>
        <button class="blog-btn" style="background:#1da1f2; color:#fff;" onclick="shareResult()">🐦 結果をXに公開</button>
    </div>
</div>

<script>
    const allQuestions = [
        // 株式
        { q: "PER（株価収益率）の計算式は？", a: ["株価 ÷ 1株当たり純利益", "株価 ÷ 1株当たり純資産", "1株当たり配当金 ÷ 株価", "純利益 ÷ 自己資本"], c: 0 },
        { q: "PBR（株価純資産倍率）が1倍を割っている状態は？", a: ["株価が解散価値を下回っている", "株価が過去最高値である", "配当金がゼロである", "会社が倒産した"], c: 0 },
        { q: "ROE（自己資本利益率）が高いほど何と言える？", a: ["経営効率が良い", "負債が多い", "株価が安い", "配当が少ない"], c: 0 },
        { q: "成行注文と指値注文、優先されるのは？", a: ["成行注文", "指値注文", "金額が大きい方", "注文が遅い方"], c: 0 },
        { q: "権利付最終日に株を保有していると得られるものは？", a: ["株主優待・配当の権利", "翌日の株価保証", "売却手数料の無料化", "議決権の喪失"], c: 0 },
        
        // 債券
        { q: "一般的に、市場金利が上昇すると債券価格はどうなる？", a: ["下落する", "上昇する", "変わらない", "倍になる"], c: 0 },
        { q: "格付けが低い債券（ジャンクボンド）の特徴は？", a: ["利回りが高く、リスクも高い", "利回りが低く、安全", "政府が保証している", "無利息である"], c: 0 },
        { q: "個人向け国債（変動10年）の金利の下限は年率何％？", a: ["0.05％", "0.01％", "0.1％", "0％"], c: 0 },
        
        // 投資信託
        { q: "投資信託の運用管理費用を何と呼ぶ？", a: ["信託報酬", "販売手数料", "信託財産留保額", "成約手数料"], c: 0 },
        { q: "インデックスファンドが目標とするのは？", a: ["市場平均（指数）との連動", "市場平均を大きく上回ること", "常にプラスの利益", "債券のみでの運用"], c: 0 },
        { q: "投資信託の解約時に支払う「ペナルティ」的な費用は？", a: ["信託財産留保額", "分配金", "基準価額", "購入時手数料"], c: 0 },
        
        // 経済指標・制度
        { q: "日本銀行が年4回公表する景気判断の調査は？", a: ["日銀短観", "GDP統計", "消費者物価指数", "家計調査"], c: 0 },
        { q: "GDP（国内総生産）に含まれないものは？", a: ["海外での日本企業の生産", "国内での外国企業の生産", "家計の消費", "政府の支出"], c: 0 },
        { q: "つみたてNISA（新NISAつみたて投資枠）の年間投資枠は？", a: ["120万円", "40万円", "240万円", "360万円"], c: 0 },
        { q: "新NISAの生涯投資枠の限度額は？", a: ["1800万円", "1200万円", "2000万円", "無制限"], c: 0 },
        
        // 外貨・その他
        { q: "1ドル100円が110円になった。これは？", a: ["円安・ドル高", "円高・ドル安", "円の価値が上がった", "デフレ"], c: 0 },
        { q: "外貨建て商品で、円貨での受取額が投資元本を下回るリスクは？", a: ["為替変動リスク", "信用リスク", "流動性リスク", "金利変動リスク"], c: 0 },
        { q: "ポートフォリオ運用において資産を分散させる主な目的は？", a: ["リスクの低減", "利益の最大化", "手数料の節約", "税金の回避"], c: 0 },
        { q: "「卵は一つのカゴに盛るな」という格言が意味するのは？", a: ["分散投資の重要性", "集中投資のすすめ", "現金の重要性", "早めの利益確定"], c: 0 },
        { q: "デフレ（デフレーション）の説明として正しいのは？", a: ["物価が下がり、貨幣価値が上がる", "物価が上がり、貨幣価値が下がる", "景気が非常に良い状態", "金利が急上昇する状態"], c: 0 }
    ];

    let quizData = [];
    let currentQuestion = 0;
    let points = 10000;
    let currentBet = 0;
    const TOTAL_PLAY = 10; // 1回10問

    function initGame() {
        quizData = [...allQuestions].sort(() => Math.random() - 0.5).slice(0, TOTAL_PLAY);
        updateDisplay();
    }

    function updateDisplay() {
        document.getElementById("points").textContent = points.toLocaleString();
        document.getElementById("qnum").textContent = currentQuestion + 1;
    }

    function setBet(amount) {
        if (amount > points) {
            alert("ポイントが足りません！");
            return;
        }
        currentBet = amount;
        document.getElementById("betScreen").classList.add("hidden");
        document.getElementById("quizScreen").classList.remove("hidden");
        loadQuestion();
    }

    function loadQuestion() {
        const resultEl = document.getElementById("result");
        resultEl.textContent = "";
        resultEl.className = "result";
        
        const q = quizData[currentQuestion];
        document.getElementById("question").textContent = q.q;
        
        const answersEl = document.getElementById("answers");
        answersEl.innerHTML = "";
        
        q.a.forEach((ans, idx) => {
            const btn = document.createElement("button");
            btn.textContent = `${idx + 1}. ${ans}`;
            btn.onclick = () => checkAnswer(idx);
            answersEl.appendChild(btn);
        });
    }

    function checkAnswer(selected) {
        const q = quizData[currentQuestion];
        const buttons = document.getElementById("answers").querySelectorAll("button");
        buttons.forEach(b => b.disabled = true);

        const resultEl = document.getElementById("result");

        if (selected === q.c) {
            points += currentBet;
            resultEl.innerHTML = `✅ 正解！ +${currentBet.toLocaleString()}pt`;
            resultEl.className = "result win";
        } else {
            points -= currentBet;
            resultEl.innerHTML = `❌ 不正解... -${currentBet.toLocaleString()}pt<br><small>正解：${q.a[q.c]}</small>`;
            resultEl.className = "result gameover";
            document.body.classList.add("flash-red");
            setTimeout(() => document.body.classList.remove("flash-red"), 800);
        }

        updateDisplay();

        setTimeout(() => {
            if (points <= 0) {
                endGame(false);
                return;
            }
            currentQuestion++;
            if (currentQuestion >= TOTAL_PLAY) {
                endGame(true);
            } else {
                document.getElementById("quizScreen").classList.add("hidden");
                document.getElementById("betScreen").classList.remove("hidden");
            }
        }, 2000);
    }

    function endGame(clear) {
        document.getElementById("quizScreen").classList.add("hidden");
        document.getElementById("betScreen").classList.add("hidden");
        document.getElementById("endScreen").classList.remove("hidden");
        
        document.getElementById("finalPoints").textContent = points.toLocaleString();
        const title = document.getElementById("endTitle");
        const rankText = document.getElementById("rankText");

        if (points <= 0) {
            title.textContent = "💥 マージンコール（強制ロスカット）";
            title.className = "gameover";
            rankText.textContent = "💀 退場した個人投資家";
        } else if (points < 10000) {
            title.textContent = "📉 資産減少...";
            rankText.textContent = "🔰 勉強中の投資家候補";
        } else if (points < 30000) {
            title.textContent = "📈 堅実な運用";
            rankText.textContent = "🥉 FP3級レベルの投資家";
        } else if (points < 100000) {
            title.textContent = "🚀 素晴らしいリターン";
            rankText.textContent = "🥈 プロ級の相場観";
        } else {
            title.textContent = "👑 伝説の相場師";
            rankText.textContent = "🥇 FPマスター・ウォーレン";
            title.className = "win";
        }
    }

    function shareResult() {
        const text = `【FP3級 投資クイズ】資産 ${points.toLocaleString()}pt 達成！ランク：${document.getElementById("rankText").textContent} 
#FP3級 #投資クイズ`;
        const url = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text);
        window.open(url, '_blank');
    }

    initGame();
</script>

</body>
</html>
