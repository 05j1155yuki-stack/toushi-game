<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FP3級 投資クイズゲーム | フリーターの投資日記</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
        }

        body {
            background: #050505;
            color: #00ff88;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: 0.3s;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: #111;
            border: 1px solid #00ff88;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.25);
        }

        /* 誘導ヘッダー */
        .top-nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .nav-link {
            text-decoration: none;
            font-size: 0.85rem;
            color: #00ff88;
            border: 1px solid #00ff88;
            padding: 6px 14px;
            border-radius: 20px;
            transition: 0.3s;
        }

        .nav-link:hover {
            background: #00ff88;
            color: #000;
        }

        .nav-link-youtube {
            text-decoration: none;
            font-size: 0.85rem;
            color: #ff4444;
            border: 1px solid #ff4444;
            padding: 6px 14px;
            border-radius: 20px;
            transition: 0.3s;
        }

        .nav-link-youtube:hover {
            background: #ff4444;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
        }

        .nav-link-kessan {
            text-decoration: none;
            font-size: 0.85rem;
            color: #00e5ff;
            border: 1px solid #00e5ff;
            padding: 6px 14px;
            border-radius: 20px;
            transition: 0.3s;
        }

        .nav-link-kessan:hover {
            background: #00e5ff;
            color: #000;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
            font-size: 1.8rem;
            text-shadow: 0 0 10px #00ff88;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 25px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .status {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
            background: #0b0b0b;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .question {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .answers {
            display: grid;
            gap: 12px;
        }

        button {
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: #1a1a1a;
            color: #00ff88;
            border: 1px solid #00ff88;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
        }

        button:hover {
            background: #00ff88;
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .bet-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .result {
            margin-top: 20px;
            text-align: center;
            min-height: 40px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .hidden { display: none; }
        .center { text-align: center; }

        /* 終了画面用の特別ナビゲーションボックス */
        .promo-section {
            margin-top: 30px;
            background: #111;
            padding: 20px;
            border-radius: 15px;
            border: 1px dashed #00ff88;
        }

        .btn-cta {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: 0.2s;
            margin-top: 12px;
            width: 100%;
        }

        .btn-blog { background: transparent; color: #00ff88 !important; border: 1px solid #00ff88; }
        .btn-blog:hover { background: #00ff88; color: #000 !important; }

        .btn-youtube { background: transparent; color: #ff4444 !important; border: 1px solid #ff4444; }
        .btn-youtube:hover { background: #ff4444; color: #fff !important; }

        .btn-x { background: transparent; color: #1da1f2 !important; border: 1px solid #1da1f2; }
        .btn-x:hover { background: #1da1f2; color: #fff !important; }

        .win { color: #00ff88; }
        .gameover { color: #ff4444; text-shadow: 0 0 10px #ff4444; }

        @media (prefers-reduced-motion: no-preference) {
            @keyframes flashRed {
                from { background: #050505; }
                to { background: #550000; }
            }
            .flash-red { animation: flashRed 0.5s alternate 4; }
        }

        .rank { margin-top: 20px; font-size: 1.5rem; font-weight: bold; color: #fff; }

        @media(max-width:600px){
            .bet-buttons { grid-template-columns: 1fr; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <nav class="top-nav">
        <a href="https://invest-challenge.com/" target="_blank" class="nav-link">🌐 投資日記ブログ</a>
        <a href="https://www.youtube.com/@フリーターの投資日記?sub_confirmation=1" target="_blank" class="nav-link-youtube">📺 YouTube登録</a>
        <a href="./kessan-mode.html" class="nav-link-kessan">📊 個別株・決算マタギ編へ</a>
    </nav>

    <h1>📈 FP3級 投資クイズゲーム</h1>
    <div class="subtitle">資産を増やして「伝説の投資家」を目指せ！</div>

    <div class="status">
        <div>保有：<span id="points">10000</span> pt</div>
        <div>進捗：<span id="qnum">1</span> / 10</div>
    </div>

    <div id="betScreen">
        <div class="question center">次の案件にいくらBETしますか？</div>
        <div class="bet-buttons">
            <button onclick="setBet(1000)">1,000pt (分散投資)</button>
            <button onclick="setBet(3000)">3,000pt (中長期保有)</button>
            <button onclick="setBet(5000)">5,000pt (短期決戦)</button>
            <button onclick="setBet(points)" style="border-color:#ff4444; color:#ff4444;">💥 ALL-IN (全力投球)</button>
        </div>
    </div>

    <div id="quizScreen" class="hidden">
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
        <div class="result" id="result"></div>
    </div>

    <div id="endScreen" class="hidden center">
        <h2 id="endTitle"></h2>
        <div class="rank" id="rankText"></div>
        <p style="margin-top:20px; font-size:1.2rem;">最終資産：<span id="finalPoints"></span> pt</p>
        
        <div class="promo-section">
            <p style="color:#aaa; font-size:0.9rem; margin-bottom:5px;">＼ さらに投資知識を深めるなら ／</p>
            
            <a href="https://invest-challenge.com/" target="_blank" class="btn-cta btn-blog">
                📘 ブログ「フリーターの投資日記」を読む
            </a>
            
            <a href="https://www.youtube.com/@フリーターの投資日記?sub_confirmation=1" target="_blank" class="btn-cta btn-youtube">
                ▶️ YouTubeチャンネルを登録する
            </a>

            <a href="javascript:void(0)" onclick="shareResult()" class="btn-cta btn-x">
                🐦 結果をXでシェアする
            </a>
        </div>

        <button style="margin-top:25px; width:100%; border-color:#555; color:#aaa;" onclick="location.reload()">
            🔄 もう一度挑戦する
        </button>
    </div>
</div>

<script>
    /* =========================
       クイズデータ
       a: 選択肢配列, c: 正解のテキスト
    ========================= */
    const allQuestions = [
        { q: "PER（株価収益率）の計算式は？", a: ["株価 ÷ 1株当たり純利益", "株価 ÷ 1株当たり純資産", "1株当たり配当金 ÷ 株価", "純利益 ÷ 自己資本"], c: "株価 ÷ 1株当たり純利益" },
        { q: "PBR（株価純資産倍率）が1倍を割っている状態は？", a: ["株価が解散価値を下回っている", "株価が過去最高値である", "配当金がゼロである", "会社が倒産した"], c: "株価が解散価値を下回っている" },
        { q: "ROE（自己資本利益率）が高いほど何と言える？", a: ["経営効率が良い", "負債が多い", "株価が安い", "配当が少ない"], c: "経営効率が良い" },
        { q: "成行注文と指値注文、優先されるのは？", a: ["成行注文", "指値注文", "金額が大きい方", "注文が遅い方"], c: "成行注文" },
        { q: "権利付最終日に株を保有していると得られるものは？", a: ["株主優待・配当の権利", "翌日の株価保証", "売却手数料の無料化", "議決権の喪失"], c: "株主優待・配当の権利" },
        { q: "一般的に、市場金利が上昇すると債券価格はどうなる？", a: ["下落する", "上昇する", "変わらない", "倍になる"], c: "下落する" },
        { q: "格付けが低い債券（ジャンクボンド）の特徴は？", a: ["利回りが高く、リスクも高い", "利回りが低く、安全", "政府が保証している", "無利息である"], c: "利回りが高く、リスクも高い" },
        { q: "個人向け国債（変動10年）の金利の下限は年率何％？", a: ["0.05％", "0.01％", "0.1％", "0％"], c: "0.05％" },
        { q: "投資信託の運用管理費用を何と呼ぶ？", a: ["信託報酬", "販売手数料", "信託財産留保額", "成約手数料"], c: "信託報酬" },
        { q: "インデックスファンドが目標とするのは？", a: ["市場平均（指数）との連動", "市場平均を大きく上回ること", "常にプラスの利益", "債券のみでの運用"], c: "市場平均（指数）との連動" },
        { q: "投資信託の解約時に支払う「ペナルティ」的な費用は？", a: ["信託財産留保額", "分配金", "基準価額", "購入時手数料"], c: "信託財産留保額" },
        { q: "日本銀行が年4回公表する景気判断の調査は？", a: ["日銀短観", "GDP統計", "消費者物価指数", "家計調査"], c: "日銀短観" },
        { q: "GDP（国内総生産）に含まれないものは？", a: ["海外での日本企業の生産", "国内での外国企業の生産", "家計の消費", "政府の支出"], c: "海外での日本企業の生産" },
        { q: "つみたてNISA（新NISAつみたて投資枠）の年間投資枠は？", a: ["120万円", "40万円", "240万円", "360万円"], c: "120万円" },
        { q: "新NISAの生涯投資枠の限度額は？", a: ["1800万円", "1200万円", "2000万円", "無制限"], c: "1800万円" },
        { q: "1ドル100円が110円になった。これは？", a: ["円安・ドル高", "円高・ドル安", "円の価値が上がった", "デフレ"], c: "円安・ドル高" },
        { q: "外貨建て商品で、円貨での受取額が投資元本を下回るリスクは？", a: ["為替変動リスク", "信用リスク", "流動性リスク", "金利変動リスク"], c: "為替変動リスク" },
        { q: "ポートフォリオ運用において資産を分散させる主な目的は？", a: ["リスクの低減", "利益の最大化", "手数料の節約", "税金の回避"], c: "リスクの低減" },
        { q: "「卵は一つのカゴに盛るな」という格言が意味するのは？", a: ["分散投資の重要性", "集中投資のすすめ", "現現金重要性", "早めの利益確定"], c: "分散投資の重要性" },
        { q: "デフレ（デフレーション）の説明として正しいのは？", a: ["物価が下がり、貨幣価値が上がる", "物価が上がり、貨幣価値が下がる", "景気が非常に良い状態", "金利が急上昇する状態"], c: "物価が下がり、貨幣価値が上がう" } /* 元データの誤字ママ */,
        { q: "表面利率2%、額面100円の債券を102円で購入し1年後に103円で売却した際の所有期間利回りは？", a: ["約2.94%", "2.00%", "3.00%", "1.00%"], c: "約2.94%" },
        { q: "投資信託の基準価額が算出される頻度は？", a: ["1営業日に1回", "リアルタイム", "1週間に1回", "決算時のみ"], c: "1営業日に1回" },
        { q: "東証株価指数（TOPIX）の算出方法は？", a: ["時価総額加重型", "修正平均株価型", "単純平均型", "出来高加重型"], c: "時価総額加重型" },
        { q: "景気動向指数において、景気に遅れて動く指標を何という？", a: ["遅行指数", "先行指数", "一致指数", "基準指数"], c: "遅行指数" },
        { q: "iDeCo（個人型確定拠出年金）の掛金の扱いは？", a: ["全額所得控除", "一部税額控除", "経費扱い", "非控除"], c: "全額所得控除" }
    ];

    let quizData = [];
    let currentQuestion = 0;
    let points = 10000;
    let currentBet = 0;
    const TOTAL_PLAY = 10;

    /* =========================
       純粋な配列シャッフル関数
    ========================= */
    function shuffleArray(array) {
        const copied = [...array];
        for (let i = copied.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copied[i], copied[j]] = [copied[j], copied[i]];
        }
        return copied;
    }

    /* =========================
       ゲーム初期化
    ========================= */
    function initGame() {
        // 1. 全問題からランダムに10問を抽出
        const shuffledQuestions = shuffleArray(allQuestions).slice(0, TOTAL_PLAY);
        
        // 2. 各問題の選択肢を独立して完全にシャッフル
        quizData = shuffledQuestions.map(q => {
            return {
                q: q.q,
                answers: shuffleArray(q.a), // ここで選択肢を独立シャッフル
                correctText: q.c            // 正解の文字列を保持
            };
        });

        updateDisplay();
    }

    function updateDisplay() {
        document.getElementById("points").textContent = points.toLocaleString();
        document.getElementById("qnum").textContent = currentQuestion + 1;
    }

    function setBet(amount) {
        if (amount > points) {
            alert("ポイントが足りません！");
            return;
        }
        currentBet = amount;
        document.getElementById("betScreen").classList.add("hidden");
        document.getElementById("quizScreen").classList.remove("hidden");
        loadQuestion();
    }

    function loadQuestion() {
        const resultEl = document.getElementById("result");
        resultEl.textContent = "";
        resultEl.className = "result";
        
        const q = quizData[currentQuestion];
        document.getElementById("question").textContent = q.q;
        
        const answersEl = document.getElementById("answers");
        answersEl.innerHTML = "";
        
        // シャッフル済みの選択肢をループしてボタン生成
        q.answers.forEach((ansText, idx) => {
            const btn = document.createElement("button");
            btn.textContent = `${idx + 1}. ${ansText}`;
            // テキストの一致で正誤判定を行う（バグの根本治療）
            btn.onclick = () => checkAnswer(ansText === q.correctText);
            answersEl.appendChild(btn);
        });
    }

    function checkAnswer(isCorrect) {
        const buttons = document.getElementById("answers").querySelectorAll("button");
        buttons.forEach(b => b.disabled = true);

        const resultEl = document.getElementById("result");
        const q = quizData[currentQuestion];

        if (isCorrect) {
            points += currentBet;
            resultEl.innerHTML = `✅ 正解！ +${currentBet.toLocaleString()}pt`;
            resultEl.className = "result win";
        } else {
            points -= currentBet;
            resultEl.innerHTML = `❌ 不正解... -${currentBet.toLocaleString()}pt<br><small>正解：${q.correctText}</small>`;
            resultEl.className = "result gameover";
            document.body.classList.add("flash-red");
            setTimeout(() => document.body.classList.remove("flash-red"), 800);
        }

        updateDisplay();

        setTimeout(() => {
            if (points <= 0) {
                endGame();
                return;
            }
            currentQuestion++;
            if (currentQuestion >= TOTAL_PLAY) {
                endGame();
            } else {
                document.getElementById("quizScreen").classList.add("hidden");
                document.getElementById("betScreen").classList.remove("hidden");
            }
        }, 2000);
    }

    function endGame() {
        document.getElementById("quizScreen").classList.add("hidden");
        document.getElementById("betScreen").classList.add("hidden");
        document.getElementById("endScreen").classList.remove("hidden");
        
        document.getElementById("finalPoints").textContent = points.toLocaleString();
        const title = document.getElementById("endTitle");
        const rankText = document.getElementById("rankText");

        if (points <= 0) {
            title.textContent = "💥 強制ロスカット（退場）";
            title.className = "gameover";
            rankText.textContent = "💀 追証に追われる投資家";
        } else if (points < 10000) {
            title.textContent = "📉 資産を守りきれず...";
            rankText.textContent = "🔰 まだまだ伸び代のある初心者";
        } else if (points < 50000) {
            title.textContent = "📈 堅実な資産形成";
            rankText.textContent = "🥉 合格圏内のFP3級投資家";
        } else if (points < 200000) {
            title.textContent = "🚀 爆益達成！";
            rankText.textContent = "🥈 市場を操る凄腕投資家";
        } else {
            title.textContent = "👑 億り人確定";
            rankText.textContent = "🥇 伝説 of FPマスター";
            title.className = "win";
        }
    }

    function shareResult() {
        const rank = document.getElementById("rankText").textContent;
        const text = `【FP3級 投資クイズ】資産 ${points.toLocaleString()}pt 達成！ランク：${rank}\n#FP3級 #投資クイズ #フリーターの投資日記\n`;
        const url = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text) + "&url=" + encodeURIComponent("https://invest-challenge.com/");
        window.open(url, '_blank');
    }

    initGame();
</script>

</body>
</html>
